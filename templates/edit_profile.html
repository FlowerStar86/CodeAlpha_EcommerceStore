{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="edit-profile-page">
    <div class="edit-profile-card">

    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="profile_picture">Profile Picture</label>

            {% if profile.profile_picture %}
                <div class="current-profile-picture">
                    <img src="{{ profile.profile_picture.url }}" alt="Profile picture">
                </div>

                <button
                    type="submit"
                    name="remove_profile_picture"
                    value="1"
                    class="remove-picture-button"
                >
                    Remove Image
                </button>
            {% endif %}

            <input
                type="file"
                id="profile_picture"
                name="profile_picture"
                accept="image/*"
                class="profile-picture-input"
            >
        </div>

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ profile.name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ user.username }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ user.email }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                value="{{ profile.age }}"
                min="1"
                max="120"
                required
            >
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="">Prefer not to say</option>
                <option value="Male" {% if profile.gender == "Male" %}selected{% endif %}>
                    Male
                </option>
                <option value="Female" {% if profile.gender == "Female" %}selected{% endif %}>
                    Female
                </option>
                <option value="Other" {% if profile.gender == "Other" %}selected{% endif %}>
                    Other
                </option>
            </select>
        </div>

        <button type="submit" class="save-profile-button">
            Save Changes
        </button>
    </form>

    <a href="/profile/" class="back-profile-button">
        Back to Profile
    </a>

</div>

</div>

{% endblock %}
