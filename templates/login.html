{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🔑</div>

        <h1>Welcome Back!</h1>

        <p class="auth-subtitle">
            Login to continue shopping
        </p>

        {% if error %}
            <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="hidden"
                name="next_url"
                value="{{ next_url }}"
            >

            <div class="form-group">

                <label for="username_or_email">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="username_or_email"
                    name="username_or_email"
                    required
                >

            </div>

            <div class="form-group password-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                    
                    <button
                        type="button"
                        class="password-toggle"
                        id="password-toggle"
                    >
                        Show password
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>

        <p class="auth-footer">

            Don't have an account?

            <a href="/register/">Register</a>

        </p>

    </div>

</div>

{% endblock %}
