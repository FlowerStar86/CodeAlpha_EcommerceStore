{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}

<h1>{{ product.name }}</h1>

{% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}" width="300">
{% endif %}

<p>{{ product.description }}</p>

<p>Price: AED {{ product.price }}</p>

<div class="product-quantity">

    <span>Quantity:</span>

    <button type="button" class="quantity-button product-minus">
        −
    </button>

    <span class="product-quantity-number" id="product-quantity">
        1
    </span>

    <button type="button" class="quantity-button product-plus">
        +
    </button>

</div>

<a
    href="/cart/add/{{ product.id }}/?quantity=1"
    class="add-to-cart"
    data-product-id="{{ product.id }}"
>
    Add to Cart
</a>

{% endblock %}
